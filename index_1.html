<style>

#bv{font-size:22px;font-weight:600;width:48px}

#pr{height:3px;background:var(--line);border-radius:2px;overflow:hidden}#pb{height:100%;width:0;background:var(--fg)}
#st{color:var(--mut);min-height:16px}.wrap{flex-wrap:wrap}

</style></head><body>

<div class="r"><label>Distort</label><input id="dist" type="range" min="0" max="100" value="55"></div>

<div class="r"><label>Split</label><input id="chroma" type="range" min="0" max="100" value="50"></div>

<div class="r wrap"><label>Ripple</label><button data-y="single" class="on">Single</button><button data-y="double">Double</button><button data-y="spiral">Spiral</button><button id="gr" class="on" style="margin-left:auto">Gradient</button></div>

rip=rip.filter(r=>beat-r.b<=r.life);NB.forEach(([r,n])=>{if(document.activeElement!==n&&n.value!==r.value)n.value=r.value;n.disabled=r.disabled});draw();recTick();requestAnimationFrame(frame)}
const NB=[];document.querySelectorAll('input[type=range]').forEach(r=>{const n=document.createElement('input');n.type='number';n.className='nb';n.min=r.min;n.max=r.max;n.step=r.step||1;n.value=r.value;n.inputMode='decimal';n.oninput=()=>{let v=parseFloat(n.value);if(isNaN(v))return;r.value=Math.max(+r.min,Math.min(+r.max,v));r.dispatchEvent(new Event('input'))};n.onchange=()=>{n.value=r.value};r.after(n);NB.push([r,n])});
